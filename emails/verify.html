<!DOCTYPE html>
<html lang="en" style="margin:0;padding:0;background:#f8f8fb;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm your email</title>
    <style>
      body{background-color:#f8f8fb;font-family:'Inter',Arial,sans-serif;margin:0;padding:0;color:#111;}
      .container{max-width:600px;margin:40px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.05);}
      .header{background:#1a1a1a;padding:20px;text-align:center;}
      .header h1{color:#fff;margin:0;font-size:24px;letter-spacing:1px;}
      .content{padding:32px;}
      .content p{line-height:1.6;font-size:15px;color:#444;}
      .cta{display:inline-block;margin-top:24px;background:#6d28d9;color:#fff;text-decoration:none;padding:14px 28px;border-radius:9999px;font-weight:600;}
      .footer{text-align:center;font-size:12px;color:#888;padding:20px 10px 40px;}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header"><h1>MEURAKI</h1></div>
      <div class="content">
        <h2>Hello {{userName}},</h2>
        <p>Thanks for signing up. Please confirm your email address to continue.</p>
        <a href="{{verifyUrl}}" class="cta">Confirm my email</a>
        <p style="margin-top:20px;">If you didn’t create an account, you can ignore this email.</p>
      </div>
      <div class="footer">© 2025 MEURAKI. All rights reserved.</div>
    </div>
  </body>
</html>
